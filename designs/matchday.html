<style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@600;700&display=swap');

    /* Clean football-broadcast scoreboard, based on the default layout. */

    .scoreboard {
        font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
        font-size: min(2.5vw, 2.5vh);
        display: flex;
        flex-direction: column;
        width: fit-content;
        min-width: 40em;
        max-width: 95vw;
        text-transform: uppercase;
        border-radius: 0.3em;
        overflow: hidden;
        box-shadow: 0 0.12em 0.55em rgba(0, 0, 0, 0.3);
    }

    /* ---------- header ---------- */

    .header {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        background: #0d0d11;
        color: #c3c3cb;
        font-family: 'Barlow', sans-serif;
        font-weight: 600;
        font-size: 0.7em;
        letter-spacing: 0.12em;
        padding: 0.38em 0.85em;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .period {
        justify-self: start;
        white-space: nowrap;
        padding: 0.12em 0.55em;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 0.24em;
    }

    .brand {
        justify-self: center;
        color: #6e6e79;
        letter-spacing: 0.28em;
        white-space: nowrap;
    }

    .time {
        grid-column: 3;
        justify-self: end;
        display: none;
        color: #fff;
        font-variant-numeric: tabular-nums;
        padding: 0.12em 0.55em;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 0.24em;
    }

    /* ---------- teams ---------- */

    .teams {
        display: grid;
        grid-template-columns: 1fr 1fr;
        width: 100%;
    }

    .home,
    .away {
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-width: 0;
        padding: 0.4em 0.75em 0.5em;
        box-sizing: border-box;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    .home {
        background:
            linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0) 45%, rgba(0, 0, 0, 0.16)),
            linear-gradient(0deg, var(--home-secondary) 10%, var(--home-primary) 10%);
        color: var(--home-text);
        border-right: 1px solid rgba(0, 0, 0, 0.25);
    }

    .away {
        background:
            linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0) 45%, rgba(0, 0, 0, 0.16)),
            linear-gradient(0deg, var(--guest-secondary) 10%, var(--guest-primary) 10%);
        color: var(--guest-text);
    }

    .teamrow {
        display: flex;
        align-items: center;
        gap: 0.45em;
        width: 100%;
        min-width: 0;
    }

    .logo {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
    }

    .logo img {
        display: block;
        width: auto;
        max-width: 2.7em;
        max-height: 2.2em;
        object-fit: contain;
    }

    .name {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-align: center;
        font-size: 1.4em;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-shadow: 0 0.04em 0.1em rgba(0, 0, 0, 0.3);
    }

    .score {
        flex: 0 0 auto;
        font-size: 2.15em;
        font-weight: 700;
        line-height: 1;
        padding: 0 0.16em;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 0.04em 0.1em rgba(0, 0, 0, 0.3);
    }

    /* ---------- penalty boxes (optional, injected by boards.html) ---------- */

    .penalty-box:empty {
        display: none;
    }
</style>

<div class="scoreboard">
    <div class="header">
        <div class="period" id="period">1. Drittel</div>
        <div class="brand">Spieltag</div>
        <div class="time" id="time" style="display:none">00:00</div>
    </div>

    <div class="teams">
        <!-- HOME -->
        <div class="home">
            <div class="teamrow">
                <div class="logo">
                    <img id="img_home" src="" alt="" onerror="this.style.display='none'">
                </div>
                <div class="name" id="name_home">Home Team</div>
                <div class="score" id="score_home">0</div>
            </div>
            <div class="penalty-box" id="pen-box-home"></div>
        </div>

        <!-- AWAY -->
        <div class="away">
            <div class="teamrow">
                <div class="score" id="score_away">0</div>
                <div class="name" id="name_away">Away Team</div>
                <div class="logo">
                    <img id="img_away" src="" alt="" onerror="this.style.display='none'">
                </div>
            </div>
            <div class="penalty-box" id="pen-box-guest"></div>
        </div>
    </div>
</div>
